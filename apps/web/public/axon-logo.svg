<svg viewBox="0 0 220 44" width="220" height="44" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: rounded square with geometric "A" -->
  <rect x="0" y="2" width="40" height="40" rx="8" ry="8" fill="url(#iconGrad)"/>
  <!-- Geometric "A" scaled inside 40×40 box -->
  <polygon points="20,8  4,38  36,38" fill="white"/>
  <polygon points="20,16  8,38  32,38" fill="url(#iconGrad)"/>
  <rect x="11" y="27.5" width="18" height="3.5" fill="white"/>
  <circle cx="20" cy="29.2" r="1.5" fill="url(#iconGrad)"/>

  <!-- "AXON" wordmark -->
  <text
    x="50" y="28"
    font-family="'Inter', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="22"
    fill="#4C1D95"
    letter-spacing="-0.5">AXON</text>

  <!-- "TICKETS" sub-label -->
  <text
    x="51" y="40"
    font-family="'Inter', Arial, sans-serif"
    font-weight="500"
    font-size="9.5"
    fill="#7C3AED"
    letter-spacing="3.2">TICKETS</text>
</svg>
