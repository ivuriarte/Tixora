<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3B0764"/>
      <stop offset="50%"  stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="18%" r="60%">
      <stop offset="0%"   stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background square (no border-radius — OS/browser applies clipping) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glowGrad)"/>

  <!-- Geometric "A" lettermark -->
  <!-- Outer triangle -->
  <polygon points="256,72  60,440  452,440" fill="white"/>
  <!-- Inner cut-out (hollow) -->
  <polygon points="256,152  112,440  400,440" fill="url(#bgGrad)"/>
  <!-- Cross-bar — redrawn in white over the cut-out -->
  <rect x="162" y="310" width="188" height="40" fill="white"/>

  <!-- Small notch in cross-bar for ticket motif -->
  <circle cx="256" cy="330" r="14" fill="url(#bgGrad)"/>
</svg>
