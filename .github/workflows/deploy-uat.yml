name: Deploy UAT

on:
  push:
    branches: [uat]

jobs:
  deploy-api:
    name: Migrate & Deploy API to UAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git commit info

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Run Prisma migrations on UAT
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          APP_ENV: uat
        run: npx prisma migrate deploy

      - name: Deploy API to Vercel UAT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel deploy --prod --environment=uat --token=$VERCEL_TOKEN

  deploy-web:
    name: Deploy Web to UAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Build
        run: npm run build

      - name: Deploy Web to Vercel UAT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel deploy --prod --environment=uat --token=$VERCEL_TOKEN

  smoke-tests:
    name: UAT Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for UAT deployment
        run: sleep 30

      - name: Run UAT smoke tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://uat.axontickets.online
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          cd apps/web
          npx playwright test --project=chromium --grep @smoke 2>&1 | tee test-results.txt

      - name: Check health endpoint
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-uat.axontickets.online/api/v1/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health: OK"
              curl -s https://api-uat.axontickets.online/api/v1/health | jq '.environment'
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying..."
            sleep 10
          done
          exit 1

      - name: Slack notification on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'UAT deployment failed. Check logs.'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
