name: Deploy UAT

# Triggers when a PR is merged into the uat branch.
# Merging a PR = push event on uat, which fires this workflow.
on:
  push:
    branches: [uat]

concurrency:
  group: uat-deploy-and-regression
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── 1. Run Prisma migrations on UAT database ─────────────────────────────
  # This MUST complete successfully before anything else runs.
  # Uses DIRECT_URL (not the pooler) because Prisma migrate requires
  # a direct connection — it cannot work through PgBouncer.
  migrate-db:
    name: Migrate UAT database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
        run: npx prisma generate

      - name: Validate migration files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
        run: npx prisma validate

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
          APP_ENV: uat
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "⚠️  DATABASE_URL_UAT or DIRECT_URL_UAT secret is not set."
            echo "    Go to: GitHub → Settings → Secrets and variables → Actions"
            echo "    Add: DATABASE_URL_UAT  (pooled connection, ?pgbouncer=true)"
            echo "    Add: DIRECT_URL_UAT    (direct connection, no pgbouncer)"
            exit 1
          fi
          echo "▶  Running prisma migrate deploy on UAT..."
          npx prisma migrate deploy
          echo "✅ Migrations complete."

  # ── 2. Build check ────────────────────────────────────────────────────────
  # Verifies the code compiles cleanly after migrations pass.
  # Vercel deploys the actual app via its own Git integration — this job
  # is a CI gate only, not the Vercel deploy itself.
  # Runs only after migrate-db succeeds.
  build-check:
    name: Build check (web + api)
    runs-on: ubuntu-latest
    needs: [migrate-db]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
        run: npx prisma generate

      - name: Build shared packages
        run: npm run build --workspace=packages/types --workspace=packages/utils 2>/dev/null || true

      - name: Type-check API
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
        run: npx tsc --noEmit

      - name: Type-check Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api-uat.axontickets.online/api/v1
        run: npx tsc --noEmit

      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api-uat.axontickets.online/api/v1
        run: npm run build

  # ── 3. Smoke tests ────────────────────────────────────────────────────────
  # Waits for Vercel to finish deploying (triggered independently by its
  # own Git integration), then checks the UAT API health endpoint.
  # Only runs if both prior jobs succeed.
  smoke-tests:
    name: UAT Smoke Tests
    runs-on: ubuntu-latest
    needs: [migrate-db, build-check]
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.UAT_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Wait for Vercel UAT deployment
        # Vercel deploys in parallel with this workflow via its Git integration.
        # 90 s is usually enough for a warm cache build. Increase if builds are slow.
        run: |
          echo "⏳ Waiting 90s for Vercel UAT deployment to go live..."
          sleep 90

      - name: Check API health endpoint
        run: |
          echo "▶  Polling https://api-uat.axontickets.online/api/v1/health"
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://api-uat.axontickets.online/api/v1/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health OK"
              curl -s https://api-uat.axontickets.online/api/v1/health | head -c 500
              exit 0
            fi
            echo "  Attempt $i/8: HTTP $STATUS — retrying in 20s…"
            sleep 20
          done
          echo "❌ API health check failed after 8 attempts."
          exit 1

      - name: Check Web health
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            -H "x-vercel-set-bypass-cookie: true" \
            https://uat.axontickets.online)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "308" ] || [ "$STATUS" = "307" ]; then
            echo "✅ Web UAT reachable (HTTP $STATUS)"
          else
            echo "❌ Web UAT returned HTTP $STATUS"
            exit 1
          fi

  # ── 4. Post-deployment public and checkout regression ───────────────────
  # This suite runs only after the new UAT deployment is healthy, so it cannot
  # accidentally validate the previous Vercel build.
  browser-regression:
    name: Post-deploy browser regression (UAT)
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    env:
      BASE_URL: https://uat.axontickets.online
      API_URL: https://api-uat.axontickets.online
      PW_ADMIN_MOCKED: '1'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.UAT_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Validate UAT browser access
        run: test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public, checkout, admin UI, accessibility, and performance suites
        run: >-
          npx playwright test
          e2e/checkout-critical.spec.ts
          e2e/admin-flows.spec.ts
          e2e/public-flows.spec.ts
          e2e/release-2-discovery.spec.ts
          e2e/release-2-accessibility.spec.ts
          e2e/release-2-performance.spec.ts
          --project=chromium
          --project=admin-mocked

      - name: Upload public Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-public-uat-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  # ── 5. Authenticated admin regression ───────────────────────────────────
  admin-regression:
    name: Post-deploy admin regression (UAT)
    if: vars.RUN_UAT_ADMIN_E2E == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      BASE_URL: https://uat.axontickets.online
      API_URL: https://api-uat.axontickets.online
      TEST_ADMIN_EMAIL: ${{ secrets.UAT_TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.UAT_TEST_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.UAT_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Validate isolated UAT credentials
        run: |
          test -n "$TEST_ADMIN_EMAIL"
          test -n "$TEST_ADMIN_PASSWORD"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated admin suite
        run: npx playwright test e2e/admin-flows.spec.ts --project=admin

      - name: Upload admin Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-uat-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14

  # ── 6. Real customer OTP and session regression ─────────────────────────
  # Uses a controlled Gmail OAuth refresh token. No password or OTP is logged,
  # and no application-side authentication bypass is introduced.
  customer-regression:
    name: Post-deploy customer OTP regression (UAT)
    if: vars.RUN_UAT_CUSTOMER_E2E == 'true'
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      BASE_URL: https://uat.axontickets.online
      API_URL: https://api-uat.axontickets.online
      TEST_CUSTOMER_EMAIL: ivvuriarte@gmail.com
      TEST_GMAIL_CLIENT_ID: ${{ secrets.UAT_TEST_GMAIL_CLIENT_ID }}
      TEST_GMAIL_CLIENT_SECRET: ${{ secrets.UAT_TEST_GMAIL_CLIENT_SECRET }}
      TEST_GMAIL_REFRESH_TOKEN: ${{ secrets.UAT_TEST_GMAIL_REFRESH_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.UAT_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Validate controlled customer mailbox
        run: |
          test -n "$TEST_CUSTOMER_EMAIL"
          test -n "$TEST_GMAIL_CLIENT_ID"
          test -n "$TEST_GMAIL_CLIENT_SECRET"
          test -n "$TEST_GMAIL_REFRESH_TOKEN"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real customer OTP and stored-session suite
        run: npx playwright test e2e/customer-flows.spec.ts --project=customer

      - name: Upload customer Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-customer-uat-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
