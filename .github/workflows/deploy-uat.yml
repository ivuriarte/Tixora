name: Deploy UAT

on:
  push:
    branches: [uat]

jobs:
  migrate-api:
    name: Migrate & Deploy API to UAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Run Prisma migrations on UAT
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL_UAT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_UAT }}
          APP_ENV: uat
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "⚠️  DATABASE_URL_UAT / DIRECT_URL_UAT secrets not set — skipping migrations."
            echo "    Add them in GitHub → Settings → Secrets and Variables → Actions."
            exit 0
          fi
          npx prisma migrate deploy

  build-web:
    name: Deploy Web to UAT
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build shared packages
        working-directory: .
        run: npm run build --workspace=packages/types --workspace=packages/utils

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api-uat.axontickets.online/api/v1
        run: npm run build

  smoke-tests:
    name: UAT Smoke Tests
    runs-on: ubuntu-latest
    needs: [migrate-api, build-web]
    if: success()

    steps:
      - name: Wait for Vercel UAT deployment
        run: sleep 60

      - name: Check API health endpoint
        run: |
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api-uat.axontickets.online/api/v1/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API health: OK"
              curl -s https://api-uat.axontickets.online/api/v1/health
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "❌ API health check failed after all retries"
          exit 1

