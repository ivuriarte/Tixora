name: Cron Jobs

on:
  schedule:
    # Every 5 minutes — releases expired cart reservations and restores
    # Redis inventory. GitHub Actions minimum interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: # allow manual trigger for testing / event-day use

jobs:
  release-reservations:
    name: Release expired reservations
    runs-on: ubuntu-latest
    steps:
      - name: POST /cron/release-reservations
        run: |
          curl --fail-with-body -s -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ vars.API_BASE_URL }}/api/v1/cron/release-reservations"

  auto-cancel-registrations:
    name: Auto-cancel expired registrations
    runs-on: ubuntu-latest
    # Runs every 5 minutes (same cadence as release-reservations). The query is
    # idempotent — it only touches tiers where saleEndsAt < now — so running it
    # frequently is safe and avoids the GH Actions queue-drift problem that made
    # a minute-based gate unreliable.
    steps:
      - name: POST /cron/auto-cancel-registrations
        run: |
          curl --fail-with-body -s -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ vars.API_BASE_URL }}/api/v1/cron/auto-cancel-registrations"
