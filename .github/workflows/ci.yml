name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + Type-check ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: |
          cd apps/api && npm ci
          cd ../web && npm ci
          cd ../../packages/types && npm ci
          cd ../utils && npm ci

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type-check Web
        run: cd apps/web && npx tsc --noEmit

  # ── Job 2: API unit tests ─────────────────────────────────────────────────
  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Install shared package dependencies
        run: |
          cd packages/types && npm ci
          cd ../utils && npm ci

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Run API unit tests
        run: cd apps/api && npm test

  # ── Job 3: Playwright E2E smoke test (public flows) ───────────────────────
  e2e-smoke:
    name: E2E Smoke Test (public flows)
    runs-on: ubuntu-latest
    # Only run on pushes to main (not on PRs to avoid unnecessary load)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: cd apps/web && npm ci

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Run public-flows E2E tests
        run: cd apps/web && npx playwright test e2e/public-flows.spec.ts --project=chromium
        env:
          BASE_URL: https://axon-tickets-app.vercel.app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Job 4: Deploy API to Vercel (main branch only) ────────────────────────
  deploy-api:
    name: Deploy API → Vercel
    runs-on: ubuntu-latest
    needs: [lint-typecheck, api-unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install all workspace dependencies
        run: |
          cd apps/api && npm ci
          cd ../web && npm ci
          cd ../../packages/types && npm ci
          cd ../utils && npm ci

      - name: Rebuild API bundle (NCC)
        run: cd apps/api && npm run vercel-build

      - name: Deploy API to Vercel (production)
        run: npx vercel --prod --yes --cwd apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
