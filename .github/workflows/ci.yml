name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + Type-check ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type-check Web
        run: cd apps/web && npx tsc --noEmit
        env:
          # Sentry vars — left empty here; type-check doesn't need real values
          SENTRY_AUTH_TOKEN: ''
          SENTRY_ORG: ''
          SENTRY_PROJECT: ''

  # ── Job 2: API unit tests ─────────────────────────────────────────────────
  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Run API unit tests
        run: cd apps/api && npm test

  # ── Job 3: Playwright E2E smoke test (public flows) ───────────────────────
  e2e-smoke:
    name: E2E Smoke Test (public flows)
    runs-on: ubuntu-latest
    # Only run on pushes to main (not on PRs to avoid unnecessary load)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Run public-flows E2E tests
        run: cd apps/web && npx playwright test e2e/public-flows.spec.ts --project=chromium
        env:
          BASE_URL: https://tixora-online-ticket-app.vercel.app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Job 4: Deploy API to Vercel (main branch only) ────────────────────────
  deploy-api:
    name: Deploy API → Vercel
    runs-on: ubuntu-latest
    needs: [lint-typecheck, api-unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild API bundle (NCC)
        run: cd apps/api && npm run vercel-build

      - name: Deploy API to Vercel (production)
        run: npx vercel --prod --yes --cwd apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Notify Slack on deploy failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: 'API deploy failed on `main`'
          SLACK_MESSAGE: 'Check the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
