name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + Type-check ──────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Type-check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type-check Web
        run: cd apps/web && npx tsc --noEmit
        env:
          # Sentry vars — left empty here; type-check doesn't need real values
          SENTRY_AUTH_TOKEN: ''
          SENTRY_ORG: ''
          SENTRY_PROJECT: ''

  # ── Job 2: API unit tests ─────────────────────────────────────────────────
  api-unit-tests:
    name: API Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build shared packages
        run: npx turbo build --filter=@axon-tickets/types --filter=@axon-tickets/utils

      - name: Run API unit tests
        run: cd apps/api && npm test

  # ── Job 3: Playwright E2E smoke test (public flows) ───────────────────────
  e2e-smoke:
    name: E2E Smoke Test (public flows)
    runs-on: ubuntu-latest
    # Only run on pushes to main (not on PRs to avoid unnecessary load)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: Run public-flows E2E tests
        run: cd apps/web && npx playwright test e2e/public-flows.spec.ts --project=chromium
        env:
          BASE_URL: https://tixora-online-ticket-app.vercel.app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── Job 4: Migrate prod database ─────────────────────────────────────────
  # Runs migrations against the production DB BEFORE the API is deployed.
  # deploy-api depends on this job so new code never hits an old schema.
  # Uses DIRECT_URL (not the pooler) because Prisma migrate requires a
  # direct connection — it cannot work through PgBouncer.
  migrate-prod:
    name: Migrate prod database
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
        run: npx prisma generate

      - name: Validate migration files
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
        run: npx prisma validate

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo "⚠️  DATABASE_URL_PROD or DIRECT_URL_PROD secret is not set."
            echo "    Go to: GitHub → Settings → Secrets and variables → Actions"
            echo "    Add: DATABASE_URL_PROD  (pooled connection, ?pgbouncer=true)"
            echo "    Add: DIRECT_URL_PROD    (direct connection, no pgbouncer)"
            exit 1
          fi
          echo "▶  Running prisma migrate deploy on PROD..."
          npx prisma migrate deploy
          echo "✅ Migrations complete."

      - name: Notify Slack on migration failure
        if: failure()
        continue-on-error: true
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: '🚨 PROD DB migration failed on `main`'
          SLACK_MESSAGE: 'Check the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  # ── Job 5: Deploy API to Vercel (main branch only) ────────────────────────
  deploy-api:
    name: Deploy API → Vercel
    runs-on: ubuntu-latest
    needs: [lint-typecheck, api-unit-tests, migrate-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild API bundle (NCC)
        run: cd apps/api && npm run vercel-build

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --cwd apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Build for Vercel (local — avoids server-side framework detection)
        run: npx vercel build --prod --cwd apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to Vercel
        working-directory: apps/api
        run: npx vercel deploy --prebuilt --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Notify Slack on deploy failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: 'API deploy failed on `main`'
          SLACK_MESSAGE: 'Check the Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
