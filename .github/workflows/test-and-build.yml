name: Test & Build (main & uat)

on:
  pull_request:
    branches: [main, uat]
  push:
    branches: [main, uat]

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build shared packages
        run: cd ../.. && npm run build --workspace=@axon-tickets/types && npm run build --workspace=@axon-tickets/utils

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
        run: npm run build

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Build shared packages
        working-directory: .
        run: npm run build --workspace=packages/types --workspace=packages/utils

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
          NEXT_PUBLIC_APP_ENV: uat
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Critical browser journeys
        env:
          BASE_URL: http://127.0.0.1:3100
          API_URL: http://127.0.0.1:3001
          PW_START_SERVER: '1'
        run: npx playwright test e2e/checkout-critical.spec.ts --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  admin-browser-uat:
    name: Admin browser suite (UAT)
    if: github.ref == 'refs/heads/uat' && vars.RUN_UAT_ADMIN_E2E == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      BASE_URL: https://uat.axontickets.online
      API_URL: https://api-uat.axontickets.online
      TEST_ADMIN_EMAIL: ${{ secrets.UAT_TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.UAT_TEST_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.UAT_VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Validate isolated UAT credentials
        run: |
          test -n "$TEST_ADMIN_EMAIL"
          test -n "$TEST_ADMIN_PASSWORD"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated admin suite
        run: npx playwright test e2e/admin-flows.spec.ts --project=admin

      - name: Upload admin Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-admin-uat-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  prisma-validate:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --workspaces

      - name: Validate Prisma schema
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma validate
